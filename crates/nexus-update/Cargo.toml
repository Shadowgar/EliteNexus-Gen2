[package]
name = "nexus-update"
description = "EliteNexus-Gen2 signed release metadata, version eligibility, archive validation and installation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
flate2.workspace = true
sha2 = "0.11"
# Checks the release manifest's signature against an explicit public key.
minisign-verify = "0.3"
# The Windows and macOS release archives; deflate is all Compress-Archive and ditto write.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# The Linux release archive (a tar.gz).
tar = { version = "0.4", default-features = false }

[dev-dependencies]
# Offline tests sign synthetic manifests with transient test keys.
minisign = "0.10"
