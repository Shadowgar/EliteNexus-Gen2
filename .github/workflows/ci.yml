name: CI

# A push or pull request that changes only the website or documents the app doesn't compile skips the build. The
# README (the support card's thanks), CHANGELOG.md (What's new after an update), docs/USER_GUIDE.md (Ask's knowledge)
# and data/ are compiled in, so changes to them still run it. The website has its own check (pages.yml). Keep the two
# lists the same.
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/ARCHITECTURE.md"
      - "docs/DESIGN.md"
      - "docs/research/**"
      - "docs/screenshots/**"
      - "docs/social-preview.png"
  pull_request:
    paths-ignore:
      - "site/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/ARCHITECTURE.md"
      - "docs/DESIGN.md"
      - "docs/research/**"
      - "docs/screenshots/**"
      - "docs/social-preview.png"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        rust: ["1.95.0", "1.100.0", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - name: Build
        run: cargo +${{ matrix.rust }} build --locked -p nexus-app
      - name: Clippy
        run: cargo +${{ matrix.rust }} clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo +${{ matrix.rust }} test --locked --workspace
