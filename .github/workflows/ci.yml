name: CI

# Routine development: one compile check on a non-draft code PR.
# No automatic workspace tests, full builds, or matrix on main pushes.
# Use the manually dispatched verification workflow for broader acceptance.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "site/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/ARCHITECTURE.md"
      - "docs/DESIGN.md"
      - "docs/research/**"
      - "docs/screenshots/**"
      - "docs/social-preview.png"
      - "CLAUDE.md"
      - "docs/DEVELOPMENT_REFERENCE.md"
      - "docs/GEN2_IMPROVEMENTS.md"
      - ".github/workflows/verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: praetorium-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Windows / Rust 1.100.0 / compile check
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-1.100.0
      - name: Compile check (no executable build)
        run: cargo +1.100.0 check --locked -p nexus-app
