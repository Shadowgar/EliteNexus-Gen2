name: Website preview

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths: ["site/**", "tools/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: praetorium-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Assemble and check preview
        run: |
          python tools/site/build.py --output _site
          python tools/site/check.py --root _site
