name: Website preview

on:
  pull_request:
    paths: ["site/**", "tools/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble and check preview
        run: |
          python tools/site/build.py --output _site
          python tools/site/check.py --root _site
